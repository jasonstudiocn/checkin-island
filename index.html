<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#061024" />
<title>打卡岛 · 碎片时间也能闪闪发光</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#061024;color:#eaf2ff;min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(900px 620px at 10% -12%, rgba(255,214,10,.18), transparent 62%),
    radial-gradient(820px 600px at 104% -4%, rgba(96,165,250,.18), transparent 58%),
    radial-gradient(760px 520px at 50% 112%, rgba(59,130,246,.13), transparent 62%);
  background-attachment:fixed;
}
:root{
  --card:rgba(255,255,255,.045);
  --card2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09);
  --txt:#eaf2ff;
  --dim:#8fa6c8;
  --yellow:#ffd60a;
  --yellow-d:#f5b700;
  --blue:#3b82f6;
  --blue-l:#60a5fa;
  --blue-d:#1d4ed8;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 160px;position:relative}
/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.3px}
.brand .logo{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,#ffd60a,#f5b700);
  border:1px solid rgba(255,214,10,.55);box-shadow:0 6px 20px rgba(255,214,10,.3)
}
.lvchip{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:6px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--yellow)
}
.topright{display:flex;align-items:center;gap:8px}
.iconbtn{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--dim);font-size:16px;line-height:1;cursor:pointer;
  display:grid;place-items:center;transition:.2s;font-family:inherit
}
.iconbtn:hover{color:var(--txt)}
.iconbtn.on{color:#fffbe6;background:linear-gradient(135deg,rgba(255,214,10,.22),rgba(59,130,246,.18));border-color:rgba(255,214,10,.42)}
.backrow{display:flex;align-items:center;gap:9px;margin:0 2px 12px}
.backrow .btn{padding:8px 13px;font-size:12.5px;border-radius:11px}
/* ---------- tabs ---------- */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);position:sticky;top:6px;z-index:40;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:14px
}
.tab{
  border:0;background:transparent;color:var(--dim);font-size:12.5px;font-weight:700;padding:9px 2px;
  border-radius:12px;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap
}
.tab.on{background:linear-gradient(135deg,#ffd60a,#f5b700);color:#12224a;box-shadow:0 6px 18px rgba(255,214,10,.3)}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.card.tight{padding:13px 14px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.4px}
/* ---------- hero ---------- */
.hero{display:flex;align-items:center;gap:16px}
.ringbox{position:relative;width:96px;height:96px;flex:0 0 96px}
.ringbox svg{width:96px;height:96px;display:block}
.ringtxt{position:absolute;inset:0;display:grid;place-items:center;line-height:1.05;text-align:center}
.ringtxt b{font-size:23px;font-weight:800;display:block}
.ringtxt span{font-size:10px;color:var(--dim);display:block;margin-top:2px}
.hero-info{flex:1;min-width:0}
.hero-info .row{display:flex;align-items:center;gap:7px;font-size:14px;margin-bottom:7px}
.hero-info .row .em{font-size:15px}
.hero-info .big{font-size:22px;font-weight:800;background:linear-gradient(90deg,#ffd60a,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),var(--blue));transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* ---------- grid items ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{
  position:relative;border:1px solid var(--line);background:var(--card2);border-radius:17px;
  padding:13px 10px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  font-family:inherit;color:var(--txt);transition:transform .16s,border-color .2s,background .2s;overflow:hidden
}
.item:active{transform:scale(.95)}
.item.done{background:linear-gradient(160deg,rgba(59,130,246,.24),rgba(29,78,216,.14));border-color:rgba(255,214,10,.6)}
.item .em{font-size:27px;line-height:1.1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.item .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.item .st{font-size:10px;color:var(--dim);font-weight:600;height:12px}
.item.done .st{color:var(--yellow)}
.item .badge{
  position:absolute;top:7px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--yellow);color:#3a2c00;font-size:11px;font-weight:900;display:grid;place-items:center
}
.item .ringpulse{position:absolute;inset:0;border-radius:17px;border:2px solid rgba(255,214,10,.7);opacity:0;pointer-events:none}
.item.pulse .ringpulse{animation:ringpulse .55s ease-out}
@keyframes ringpulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.tlrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055)}
.tlrow .em{font-size:19px}
.tlrow .nm{font-size:13px;font-weight:700;flex:1}
.tlrow .tm{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.tlrow .gp{font-size:12px;font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums}
.tlrow .del{border:0;background:rgba(255,255,255,.06);color:var(--dim);width:24px;height:24px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;font-family:inherit}
.tlrow .del:hover{background:rgba(239,68,68,.2);color:#fca5a5}
/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(120deg,#ffd60a,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .k{font-size:11px;color:var(--dim);font-weight:700;margin-top:3px}
.chartwrap{width:100%;overflow:hidden}
.rank{display:flex;flex-direction:column;gap:9px}
.rankrow{display:flex;align-items:center;gap:10px}
.rankrow .em{font-size:17px;width:22px;text-align:center}
.rankrow .nm{font-size:12.5px;font-weight:700;width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankrow .track{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.rankrow .track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rankrow .ct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;width:38px;text-align:right;font-weight:700}
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.heat::-webkit-scrollbar{display:none}
.hcol{display:flex;flex-direction:column;gap:3px}
.hcell{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.05)}
.heatlegend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:10px;color:var(--dim);margin-top:8px}
.heatlegend i{width:11px;height:11px;border-radius:3px;display:block}
/* ---------- achievements ---------- */
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:420px){.achs{grid-template-columns:repeat(4,1fr)}}
.ach{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;opacity:.42;filter:grayscale(1);transition:.25s}
.ach.on{opacity:1;filter:none;border-color:rgba(255,214,10,.4);background:linear-gradient(160deg,rgba(255,214,10,.14),rgba(255,255,255,.03));box-shadow:0 6px 22px rgba(255,214,10,.1)}
.ach .em{font-size:25px;display:block;margin-bottom:5px}
.ach .nm{font-size:11.5px;font-weight:800}
.ach .ds{font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.35}
/* ---------- settings ---------- */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.field:last-child{border-bottom:0}
.field .lb{font-size:13.5px;font-weight:700}
.field .hint{font-size:11px;color:var(--dim);margin-top:2px}
.inp{
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:8px 11px;font-size:13px;font-family:inherit;outline:none;min-width:0
}
.inp:focus{border-color:rgba(255,214,10,.5)}
.inp.sm{width:60px;text-align:center}
.inp.xs{width:44px;text-align:center;padding:8px 4px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:rgba(255,255,255,.12);width:118px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#ffd60a,#3b82f6);cursor:pointer;box-shadow:0 2px 8px rgba(255,214,10,.45)}
.switch{width:46px;height:27px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;border:0;transition:.22s;flex:0 0 46px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.22s}
.switch.on{background:linear-gradient(135deg,#ffd60a,#f5b700)}
.switch.on::after{left:22px}
.itemedit{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.itemedit:last-of-type{border-bottom:0}
.btn{
  border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:13px;padding:11px 15px;
  font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s;display:inline-flex;
  align-items:center;justify-content:center;gap:6px
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ffd60a,#f5b700);color:#12224a;border-color:transparent;box-shadow:0 8px 24px rgba(255,214,10,.28)}
.btn.warn{color:#fca5a5;border-color:rgba(239,68,68,.28)}
.btn.block{width:100%}
.btnrow{display:flex;gap:9px}
.btnrow .btn{flex:1}
/* ---------- 每日箴言（首页激励提示栏） ---------- */
.quote{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,214,10,.15),rgba(59,130,246,.15) 58%,rgba(96,165,250,.07));
  border-color:rgba(255,214,10,.3)
}
.quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--yellow),var(--blue))}
.quote::after{
  content:"";position:absolute;right:-46px;top:-58px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,10,.26),transparent 70%);pointer-events:none
}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:relative;z-index:1}
.qlabel{font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--yellow);display:flex;align-items:center;white-space:nowrap}
.qlabel .qdot{
  width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-right:6px;display:inline-block;
  animation:qpulse 1.9s ease-in-out infinite
}
@keyframes qpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.qwho{
  font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07)
}
.qbody{position:relative;z-index:1;padding-left:14px}
.qmark{
  position:absolute;left:-4px;top:-15px;font-family:Georgia,"Times New Roman",serif;
  font-size:46px;line-height:1;font-weight:900;color:rgba(255,214,10,.32)
}
.qtext{font-size:15.5px;line-height:1.76;font-weight:700;color:#eaf2ff;letter-spacing:.2px}
.qsrc{font-size:11.5px;color:var(--dim);margin-top:7px;font-weight:600}
.qnote{
  display:flex;gap:6px;font-size:12px;color:#c3d6f5;margin-top:10px;line-height:1.65;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 10px
}
.qfoot{display:flex;align-items:center;gap:6px;margin-top:12px;position:relative;z-index:1}
.qbtn{
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--dim);border-radius:10px;
  padding:6px 9px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.18s;line-height:1.25
}
.qbtn:hover{color:var(--txt);border-color:rgba(255,214,10,.35)}
.qbtn:active{transform:scale(.94)}
.qbtn.on{color:#3a2c00;background:linear-gradient(135deg,#ffd60a,#f5b700);border-color:transparent}
.qidx{font-size:11px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.qspacer{flex:1}
.quote.anim .qbody,.quote.anim .qfoot{animation:qin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(6,16,36,.96) 45%,rgba(6,16,36,0));pointer-events:none
}
.dock .inner{max-width:560px;margin:0 auto;pointer-events:auto}
/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(3,8,20,.78);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#0d1c3d;border:1px solid var(--line);
  border-radius:22px;padding:18px;animation:sheetin .28s cubic-bezier(.2,.9,.25,1)
}
@keyframes sheetin{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.share-img{width:100%;border-radius:14px;display:block;border:1px solid var(--line);margin-bottom:14px}
/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);z-index:900;
  background:rgba(13,28,61,.97);border:1px solid var(--line);color:var(--txt);padding:11px 17px;border-radius:14px;
  font-size:13px;font-weight:700;opacity:0;transition:.26s;pointer-events:none;max-width:86vw;text-align:center;
  box-shadow:0 12px 34px rgba(0,0,0,.5)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:rgba(255,214,10,.45)}
.toast.bad{border-color:rgba(239,68,68,.45)}
.float-text{position:fixed;z-index:800;font-weight:900;font-size:19px;pointer-events:none;transform:translateX(-50%);animation:floatup 1.1s cubic-bezier(.2,.7,.3,1) forwards;text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes floatup{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}22%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.12)}100%{opacity:0;transform:translateX(-50%) translateY(-62px) scale(1)}}
.confetti{position:fixed;width:8px;height:14px;border-radius:2px;pointer-events:none;z-index:850;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg);opacity:.08}}
.empty{text-align:center;color:var(--dim);font-size:12.5px;padding:20px 8px;line-height:1.7}
.unlock{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.unlock:last-child{border-bottom:0}
.unlock .em{font-size:26px}
.unlock b{font-size:13.5px;display:block}
.unlock span{font-size:11px;color:var(--dim)}
/* ---------- 倒计时 / 日历 ---------- */
.cd{position:relative;overflow:hidden}
.cd-glow{position:absolute;left:-15%;right:-15%;top:-96px;height:210px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,214,10,.3),rgba(255,214,10,0) 72%)}
.cd-top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cd-lab{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.cd-line{display:flex;align-items:baseline;margin-top:2px}
.cd-num{font-size:56px;font-weight:900;line-height:.94;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#ffd60a,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.cd-unit{font-size:15px;font-weight:800;color:var(--dim);margin-left:7px}
.cd-goal{text-align:right;line-height:1.6}
.cd-goal b{display:block;font-size:14.5px;color:var(--yellow);font-weight:800}
.cd-goal span{font-size:11px;color:var(--dim);font-weight:700}
.cd-meta{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;color:var(--dim);font-weight:700;margin-top:9px;font-variant-numeric:tabular-nums}
.cd-chips{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.cd-chip{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.cd-chip b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}
.cd-chip b i{font-size:11px;font-style:normal;color:var(--dim);margin-left:2px;font-weight:700}
.cd-chip span{display:block;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.cal8{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:3px}
.cal8 i{display:block;aspect-ratio:1/1;border-radius:4px;background:rgba(255,255,255,.05);transition:.15s}
.cal8 i.miss{background:rgba(96,165,250,.16)}
.cal8 i.fut{background:rgba(255,255,255,.022)}
.cal8 i.d1{background:rgba(255,214,10,.34)}
.cal8 i.d2{background:rgba(255,214,10,.6)}
.cal8 i.d3{background:#ffd60a}
.cal8 i.full{background:linear-gradient(135deg,#ffd60a,#3b82f6)}
.cal8 i.tod{box-shadow:0 0 0 1.6px #60a5fa}
.mon{margin-top:14px}
.mon:first-child{margin-top:2px}
.mon-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mon-h b{font-size:12.5px;font-weight:800;color:#d6e4ff}
.mon-h span{font-size:10.5px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .dw{font-size:10px;color:var(--dim);font-weight:700;text-align:center;padding-bottom:3px}
.dcell{
  position:relative;aspect-ratio:1/1;border-radius:10px;display:grid;place-items:center;
  font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--dim);
  background:rgba(255,255,255,.05);border:1px solid transparent;font-family:inherit;padding:0;cursor:default
}
.dcell.blank{background:transparent;border:0}
.dcell.out{background:rgba(255,255,255,.017);color:#465877}
.dcell.fut{background:rgba(255,255,255,.026);color:#5b6d8a}
.dcell.miss{background:rgba(96,165,250,.13);color:#8299bb}
.dcell.d1{background:rgba(255,214,10,.24);color:#ffe98a;border-color:rgba(255,214,10,.26)}
.dcell.d2{background:rgba(255,214,10,.48);color:#2a2000;border-color:rgba(255,214,10,.5)}

<script>
/* =========================================================

(function () {
  'use strict';

  var KEY = 'checkin-island.v1';

  var EMOJI_POOL = ['🏊','💪','🤸','🦾','📈','🎴','🥁','🧘','🏃','🚴','🧗','🥊','🏋️','🤾','⛹️','📖','✍️','🎸','🎹','🎤','🧠','💧','🥗','☀️','🌙','🧹','💰','🪙','📊','🎯','🧩','🦷','🚶','🍎'];

  var LEVELS = [
    { lv: 1,  need: 0,    title: '咸鱼翻身',     em: '🐟' },
    { lv: 2,  need: 60,   title: '摸鱼选手',     em: '🎣' },

    { lv: 4,  need: 300,  title: '坚持青年',     em: '🔥' },
    { lv: 5,  need: 500,  title: '铁人候选',     em: '⚡' },
    { lv: 6,  need: 800,  title: '打卡狂魔',     em: '😈' },
    { lv: 7,  need: 1200, title: '自律大师',     em: '🧘' },
    { lv: 8,  need: 1800, title: '传说人物',     em: '👑' },
    { lv: 9,  need: 2600, title: '时间管理之神', em: '🕰️' },
    { lv: 10, need: 3600, title: '不可阻挡',     em: '🚀' }
  ];

  var CHEERS = [
    '这波上分了！','又稳住了，兄弟','今天也没放过自己','碎片时间被你捡起来了',
    '坚持的人运气都不会差','明天的你会感谢现在','状态拉满','小步快跑，积少成多',
    '就这个节奏，别停','你比昨天更强了一点'
  ];

  /* ---- 每日箴言：作者元信息 ---- */
  var AUTHORS = {
    nietzsche: { name:'尼采',   em:'🧠', tag:'哲学家', color:'#60a5fa' },
    musk:      { name:'马斯克', em:'🚀', tag:'创业家', color:'#ffd60a' }
  };

  /* ---- 每日箴言：名言库（text 正文 / src 出处 / note 一句解读） ---- */
  var QUOTES = [
    { id:'n1', who:'nietzsche', text:'凡杀不死我的，必使我更强大。',
      src:'《偶像的黄昏》', note:'每一次撑过去的难，都在替你升级。' },
    { id:'n2', who:'nietzsche', text:'一个人知道自己为什么而活，就可以忍受任何一种生活。',
      src:'《偶像的黄昏》', note:'先想清楚"为什么"，日子再难也走得动。' },
    { id:'n3', who:'nietzsche', text:'每一个不曾起舞的日子，都是对生命的辜负。',
      src:'《查拉图斯特拉如是说》', note:'今天不想动的时候，就记起这句话。' },
    { id:'n4', who:'nietzsche', text:'你必须准备在自己心中拥有混沌，才能生出一颗跳舞的星星。',
      src:'《查拉图斯特拉如是说》', note:'允许自己乱一点，改变往往从这里开始。' },
    { id:'n5', who:'nietzsche', text:'谁终将声震人间，必长久深自缄默。',
      src:'《查拉图斯特拉如是说》', note:'沉得住气的人，才等得到爆发那一刻。' },
    { id:'n6', who:'nietzsche', text:'人是一根绳索，悬在动物与超人之间——一根悬于深渊之上的绳索。',
      src:'《查拉图斯特拉如是说》', note:'你不是在忍受过程，你就是在成为自己。' },
    { id:'n7', who:'nietzsche', text:'真正的男人，内心藏着一个孩子——他想玩耍。',
      src:'《查拉图斯特拉如是说》', note:'别把认真弄丢了，玩也要玩得投入。' },
    { id:'n8', who:'nietzsche', text:'我的时代还没有到来，有些人死后方生。',
      src:'《看哪这人》', note:'现在看不到结果，不等于没有结果。' },
    { id:'n9', who:'nietzsche', text:'人是一种应该被超越的东西。',
      src:'《查拉图斯特拉如是说》', note:'今天比昨天往前挪一点，就是在超越。' },
    { id:'m1', who:'musk', text:'如果一件事足够重要，即使胜算不大，你也应该去做。',
      src:'', note:'"重要"本身就比"容易"更值得当理由。' },
    { id:'m2', who:'musk', text:'失败是一个选项。如果你没有失败，说明你的创新还不够。',
      src:'', note:'怕失败，才是最大的风险。' },
    { id:'m3', who:'musk', text:'我认为，普通人也可以选择成为不平凡的人。',
      src:'', note:'起点普通，不代表终点普通。' },
    { id:'m4', who:'musk', text:'坚持非常重要。除非被逼到绝境，否则不要放弃。',
      src:'', note:'大多数放弃，都发生在离成功最近的那一次。' },
    { id:'m5', who:'musk', text:'不要因为别人这么做就跟着做——回到第一性原理，从本质重新推理。',
      src:'', note:'想清楚这件事的本质，再动手。' },
    { id:'m6', who:'musk', text:'我宁愿乐观而犯错，也不愿悲观而正确。',
      src:'', note:'心态决定了你还能坚持多久。' },
    { id:'m7', who:'musk', text:'我犯过的最大错误，是过于看重一个人的才华，而低估了他的用心。',
      src:'', note:'才华决定上限，用心决定下限。' },
    { id:'m8', who:'musk', text:'每天醒来都相信未来会更好的人，才真的能把未来变好。',
      src:'', note:'你相信的那个未来，值得你为它打卡。' },
    { id:'m9', who:'musk', text:'创业就像一边嚼着碎玻璃，一边凝视深渊。',
      src:'', note:'难做的事才值钱，舒服的路早被人走完了。' }
  ];

  var ACHS = [
    { id:'first',   em:'👣', name:'第一步',   desc:'完成首次打卡',      fn:function(s,r){ return r.count >= 1; } },
    { id:'s3',      em:'🌱', name:'三日之约', desc:'连续打卡 3 天',      fn:function(s,r){ return r.streak >= 3; } },
    { id:'s7',      em:'🔥', name:'一周不辍', desc:'连续打卡 7 天',      fn:function(s,r){ return r.streak >= 7; } },
    { id:'s30',     em:'🏆', name:'月度铁人', desc:'连续打卡 30 天',     fn:function(s,r){ return r.streak >= 30; } },
    { id:'goal',    em:'✅', name:'今日达标', desc:'完成单日目标',       fn:function(s,r){ return r.goalDone >= 1; } },
    { id:'full',    em:'🎯', name:'全垒打',   desc:'单日完成全部项目',   fn:function(s,r){ return r.fullDay >= 1; } },
    { id:'p500',    em:'💎', name:'五百分',   desc:'累计 500 积分',      fn:function(s,r){ return r.points >= 500; } },
    { id:'p2000',   em:'🌟', name:'两千分',   desc:'累计 2000 积分',     fn:function(s,r){ return r.points >= 2000; } },
    { id:'early',   em:'🐦', name:'早起鸟',   desc:'早上 7 点前打卡',    fn:function(s,r){ return r.early; } },
    { id:'night',   em:'🌙', name:'夜猫子',   desc:'深夜 23 点后打卡',   fn:function(s,r){ return r.night; } },
    { id:'allround',em:'🎖️', name:'全能选手', desc:'每个项目都打过卡',   fn:function(s,r){ return r.allround; } },
    { id:'m100',    em:'📅', name:'百次打卡', desc:'累计打卡 100 次',    fn:function(s,r){ return r.count >= 100; } }
  ];

  var S = null;
  var tab = 'today';
  var prevTab = 'today';
  var lastUnlocked = [];

  var Q_AUTO_MS = 18000;   // 箴言自动轮播间隔
  var qIdx = -1;           // 当前箴言下标（-1 = 未初始化，按日期播种）
  var qTimer = null;       // 自动轮播定时器

  /* ---------------- 工具 ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function parseKey(k) {
    var p = k.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function todayStr() {
    var d = new Date();
    var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + w;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function uid() { return 'it' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

  /* ---------------- 数据 ---------------- */
  function freshItems() {
    return [
      { id:'swim',    emoji:'🏊', name:'游泳',       points:12 },
      { id:'pushup',  emoji:'💪', name:'俯卧撑',     points:8  },
      { id:'situp',   emoji:'🐠', name:'鱼缸',       points:8  },
      { id:'grip',    emoji:'🦾', name:'臂力棒',     points:8  },
      { id:'binance', emoji:'📈', name:'BNTrade',    points:10 },
      { id:'card',    emoji:'🎴', name:'精英卡片',   points:6  },
      { id:'drum',    emoji:'🥁', name:'打鼓',       points:10 },
      { id:'breath',  emoji:'🧘', name:'冥想深呼吸', points:6  },
      { id:'dedao',   emoji:'🎧', name:'得到头条',   points:8  },
      { id:'nodrink', emoji:'🚫', name:'今天不喝酒', points:10 }
    ];
  }
  function fresh() {
    return {
      v: 1,
      name: '',
      createdAt: Date.now(),
      items: freshItems(),
      logs: {},
      bonus: [],
      chests: {},
      achs: [],
      flags: {},
      settings: { dailyGoal: 3, sound: true, quoteAuto: true, goalDate: '2027-01-01' }
    };
  }
  function load() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    var base = fresh();
    if (!raw || raw.v !== 1) { S = base; return; }
    S = base;
    if (typeof raw.name === 'string') S.name = raw.name;
    if (Array.isArray(raw.items) && raw.items.length) S.items = raw.items;
    if (raw.logs && typeof raw.logs === 'object') S.logs = raw.logs;
    if (Array.isArray(raw.bonus)) S.bonus = raw.bonus;
    if (raw.chests && typeof raw.chests === 'object') S.chests = raw.chests;
    if (Array.isArray(raw.achs)) S.achs = raw.achs;
    if (raw.flags && typeof raw.flags === 'object') S.flags = raw.flags;
    if (raw.settings) {
      if (typeof raw.settings.dailyGoal === 'number') S.settings.dailyGoal = raw.settings.dailyGoal;
      if (typeof raw.settings.sound === 'boolean') S.settings.sound = raw.settings.sound;
      if (typeof raw.settings.quoteAuto === 'boolean') S.settings.quoteAuto = raw.settings.quoteAuto;
      if (typeof raw.settings.goalDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.settings.goalDate)) S.settings.goalDate = raw.settings.goalDate;
    }
    if (raw.createdAt) S.createdAt = raw.createdAt;

    // 迁移：把默认项目「仰卧起坐」更名为「鱼缸」、「币安交易」更名为「BNTrade」
    // （沿用原 id，历史打卡记录不丢）
    var migrated = false;
    for (var mi = 0; mi < S.items.length; mi++) {
      if (S.items[mi].id === 'situp' && S.items[mi].name === '仰卧起坐') {
        S.items[mi].name = '鱼缸';
        S.items[mi].emoji = '🐠';
        migrated = true;
      }
      if (S.items[mi].id === 'binance' && S.items[mi].name === '币安交易') {
        S.items[mi].name = 'BNTrade';
        migrated = true;
      }
    }
    if (migrated) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

    // 迁移：补齐新增的默认项目「今天不喝酒」（只自动补一次，之后手动删掉就不会再回来）
    if (!S.flags.addedNoDrink) {
      var hasND = false;
      for (var ni = 0; ni < S.items.length; ni++) { if (S.items[ni].id === 'nodrink') hasND = true; }
      if (!hasND && S.items.length < 16) {
        S.items.push({ id: 'nodrink', emoji: '🚫', name: '今天不喝酒', points: 10 });
      }
      S.flags.addedNoDrink = true;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }

    // 迁移：补齐新增的默认项目「得到头条」（只自动补一次，之后手动删掉就不会再回来）
    if (!S.flags.addedDedao) {
      var hasDD = false;
      for (var di = 0; di < S.items.length; di++) { if (S.items[di].id === 'dedao') hasDD = true; }
      if (!hasDD && S.items.length < 16) {
        // 插到「今天不喝酒」前面，让那一项继续收尾
        var ndIdx = -1;
        for (var dj = 0; dj < S.items.length; dj++) { if (S.items[dj].id === 'nodrink') ndIdx = dj; }
        var ddItem = { id: 'dedao', emoji: '🎧', name: '得到头条', points: 8 };
        if (ndIdx >= 0) { S.items.splice(ndIdx, 0, ddItem); } else { S.items.push(ddItem); }
      }
      S.flags.addedDedao = true;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('本地存储写入失败，可能空间已满', 'bad'); }
    if (!_syncQuiet) syncSoon();   // 本机数据变了，稍后静默回推云端
  }

  /* ---------------- 统计 ---------------- */
  function dayLogs(k) { return S.logs[k] || []; }
  function hasItem(list, id) {
    for (var i = 0; i < (list || []).length; i++) { if (list[i].k === id) return true; }
    return false;
  }
  function itemById(id) {
    for (var i = 0; i < S.items.length; i++) { if (S.items[i].id === id) return S.items[i]; }
    return null;
  }
  function totals() {
    var sum = 0, count = 0, k, i;
    for (k in S.logs) {
      var arr = S.logs[k];
      for (i = 0; i < arr.length; i++) { sum += arr[i].got || 0; count++; }
    }
    for (i = 0; i < S.bonus.length; i++) { sum += S.bonus[i].amount || 0; }
    return { sum: sum, count: count };
  }
  function levelInfo(sum) {
    var cur = LEVELS[0], next = LEVELS[1];
    for (var i = 0; i < LEVELS.length; i++) {
      if (sum >= LEVELS[i].need) { cur = LEVELS[i]; next = LEVELS[i + 1] || null; }
    }
    var base = cur.need;
    var target = next ? next.need : (cur.need + 1200);
    var pct = target > base ? Math.min(1, (sum - base) / (target - base)) : 1;
    return {
      lv: cur.lv, title: cur.title, em: cur.em, base: base, target: target,
      pct: pct, toNext: Math.max(0, target - sum),
      isMax: !next
    };
  }
  function currentStreak() {
    var n = 0, guard = 0;
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!dayLogs(dayKey(d)).length) d = addDays(d, -1);
    while (dayLogs(dayKey(d)).length && guard++ < 3650) { n++; d = addDays(d, -1); }
    return n;
  }
  function longestStreak() {
    var keys = Object.keys(S.logs).filter(function (k) { return dayLogs(k).length; }).sort();
    var best = 0, cur = 0, prev = null;
    for (var i = 0; i < keys.length; i++) {
      if (prev) {
        var diff = Math.round((parseKey(keys[i]) - parseKey(prev)) / 86400000);
        cur = (diff === 1) ? cur + 1 : 1;
      } else { cur = 1; }
      if (cur > best) best = cur;
      prev = keys[i];
    }
    return best;
  }
  function itemStreak(id) {
    var n = 0, guard = 0;
    var d = new Date(); d.setHours(0, 0, 0, 0);
    if (!hasItem(dayLogs(dayKey(d)), id)) d = addDays(d, -1);
    while (hasItem(dayLogs(dayKey(d)), id) && guard++ < 3650) { n++; d = addDays(d, -1); }
    return n;
  }
  // 连击数，但从指定日期往回数（补打卡按那天的倍率记分用）
  function itemStreakAt(id, key) {
    var n = 0, guard = 0;
    var d = parseKey(key);
    if (!hasItem(dayLogs(dayKey(d)), id)) d = addDays(d, -1);
    while (hasItem(dayLogs(dayKey(d)), id) && guard++ < 3650) { n++; d = addDays(d, -1); }
    return n;
  }
  function itemTotal(id) {
    var n = 0;
    for (var k in S.logs) { if (hasItem(S.logs[k], id)) n += S.logs[k].filter(function (r) { return r.k === id; }).length; }
    return n;
  }
  function goalDoneDays() {
    var n = 0, goal = S.settings.dailyGoal;
    for (var k in S.logs) { if (S.logs[k].length >= goal) n++; }
    return n;
  }
  function fullDays() {
    var n = 0, total = S.items.length;
    for (var k in S.logs) {
      var seen = {};
      S.logs[k].forEach(function (r) { seen[r.k] = 1; });
      if (Object.keys(seen).length >= total && total > 0) n++;
    }
    return n;
  }

  /* ---------------- 倒计时 & 日历 ---------------- */
  var CHALLENGE_DAYS = 88;             // 倒数周期长度（天）
  var MAKEUP_LIMIT = 7;                // 最多补最近 7 天（含今天），再早的只能看不能补
  function goalKey() { return S.settings.goalDate || '2027-01-01'; }
  function goalDate() { return parseKey(goalKey()); }
  function midnight(d) { var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0); return x; }
  function daysLeft() {
    return Math.round((goalDate().getTime() - midnight(new Date()).getTime()) / 86400000);
  }
  function challengeStart() { return addDays(goalDate(), -CHALLENGE_DAYS); }   // 倒数第 88 天
  function challengeEnd() { return addDays(goalDate(), -1); }                  // 倒数第 1 天
  function dayNum(d) { return midnight(d).getTime(); }
  // 两个日期相差的天数（a - b），用于补打卡窗口判断
  function dayGap(a, b) { return Math.round((midnight(a).getTime() - midnight(b).getTime()) / 86400000); }
  function inWindow(d) {
    return dayNum(d) >= dayNum(challengeStart()) && dayNum(d) <= dayNum(challengeEnd());
  }
  function dayLevel(n) {
    var total = S.items.length || 1;
    if (n <= 0) return 'miss';
    if (n >= total) return 'full';
    if (n >= 3) return 'd3';
    if (n === 2) return 'd2';
    return 'd1';

    var d = new Date(start.getTime());
    var guard = 0;
    while (dayNum(d) <= dayNum(end) && guard++ < 400) {
      var n = dayLogs(dayKey(d)).length;
      var isPast = dayNum(d) <= dayNum(today);
      if (isPast) {
        passed++;
        if (n > 0) {

          if (n >= S.settings.dailyGoal) goals++;
          if (n >= (S.items.length || 1)) fulls++;
        } else {

        }
      }
      d = addDays(d, 1);
    }
    var left = Math.max(0, daysLeft());
    return {
      passed: passed, done: done, fulls: fulls, goals: goals, missed: missed,
      best: best,
      cur: Math.min(currentStreak(), CHALLENGE_DAYS),
      left: left,
      total: CHALLENGE_DAYS,
      elapsed: Math.max(0, Math.min(CHALLENGE_DAYS, CHALLENGE_DAYS - left)),

  }

  /* ---------------- 音效 & 特效 ---------------- */
  var AC = null;
  function beep(freq, dur, type, vol, delay) {
    if (!S.settings.sound) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      var t0 = AC.currentTime + (delay || 0);
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.14));
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + (dur || 0.14) + 0.03);
    } catch (e) { /* 忽略音频错误 */ }
  }
  function sfxCheck() { beep(880, 0.13, 'sine', 0.05, 0); beep(1320, 0.16, 'sine', 0.04, 0.07); }

      goalDone: goalDoneDays(), fullDay: fullDays(), early: false, night: false,
      allround: true, lv: lv.lv
    };
    var allIds = S.items.map(function (i) { return i.id; });
    var seen = {};
    for (var k in S.logs) {
      S.logs[k].forEach(function (rec) {
        seen[rec.k] = 1;
        var h = new Date(rec.ts).getHours();
        if (h < 7) r.early = true;
        if (h >= 23) r.night = true;
      });
    }
    for (var i = 0; i < allIds.length; i++) { if (!seen[allIds[i]]) { r.allround = false; break; } }
    if (extra) { for (var p in extra) r[p] = extra[p]; }

  function checkAch(reason) {
    var r = snapshot();

      var ok = false;
      try { ok = !!a.fn(S, r); } catch (e) { ok = false; }
      if (ok) { S.achs.push(a.id); unlocked.push(a); }
    }
    if (unlocked.length) {

  function barChart(days) {

      '<stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>';
    for (i = 0; i < data.length; i++) {
      var h = data[i].n > 0 ? Math.max(3, data[i].n / max * 34) : 1.6;
      var x = i * bw + bw * 0.18;
      var w = bw * 0.64;
      var y = 38 - h;
      var fill = data[i].n > 0 ? 'url(#barG)' : 'rgba(255,255,255,.09)';
      svg += '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="1.2" fill="' + fill + '"/>';
      if (data[i].n > 0) {
        svg += '<text x="' + (x + w / 2).toFixed(2) + '" y="' + (y - 1.4).toFixed(2) + '" font-size="3.2" fill="#8fa6c8" text-anchor="middle">' + data[i].n + '</text>';
      }
    }
    svg += '<text x="0.4" y="44" font-size="3" fill="#8fa6c8">' + (data[0].day.getMonth() + 1) + '/' + data[0].day.getDate() + '</text>';
    svg += '<text x="99.6" y="44" font-size="3" fill="#8fa6c8" text-anchor="end">今天</text>';
    svg += '</svg>';
    return svg;
  }

  function heatmap() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var sunday = addDays(today, -today.getDay());
    var start = addDays(sunday, -(WEEKS_HEAT - 1) * 7);
    var colHtml = '';
    for (var w = 0; w < WEEKS_HEAT; w++) {
      var cells = '';
      for (var r = 0; r < 7; r++) {
        var d = addDays(start, w * 7 + r);
        var future = d > today;
        var n = future ? 0 : dayLogs(dayKey(d)).length;
        var bg;
        if (future) bg = 'rgba(255,255,255,.02)';
        else if (n === 0) bg = 'rgba(255,255,255,.05)';
        else if (n === 1) bg = 'rgba(255,214,10,.35)';
        else if (n === 2) bg = 'rgba(255,214,10,.55)';
        else if (n <= 4) bg = 'rgba(255,214,10,.78)';
        else bg = '#ffd60a';
        var isToday = (dayKey(d) === dayKey(today));
        cells += '<div class="hcell" title="' + dayKey(d) + ' · ' + n + ' 次" style="background:' + bg + (isToday ? ';box-shadow:0 0 0 1.5px #3b82f6' : '') + '"></div>';
      }
      colHtml += '<div class="hcol">' + cells + '</div>';
    }
    return '<div class="heat">' + colHtml + '</div>';
  }

  /* ---------------- 倒计时日历视图 ---------------- */
  function goalLabel() {
    var g = goalDate();
    if (g.getMonth() === 0 && g.getDate() === 1) return g.getFullYear() + ' 年元旦';
    return g.getFullYear() + ' 年 ' + (g.getMonth() + 1) + ' 月 ' + g.getDate() + ' 日';

  function cal88() {
    var start = challengeStart(), today = midnight(new Date());
    var out = '';
    for (var i = 0; i < CHALLENGE_DAYS; i++) {
      var d = addDays(start, i);
      var n = dayLogs(dayKey(d)).length;
      var cls = [];
      if (dayNum(d) > dayNum(today)) cls.push('fut');
      else cls.push(dayLevel(n));
      if (dayKey(d) === dayKey(today)) cls.push('tod');
      out += '<i class="' + cls.join(' ') + '" title="第 ' + (i + 1) + ' 天 · ' + dayKey(d) + ' · ' + (n ? n + ' 项打卡' : '没打卡') + '"></i>';
    }
    return '<div class="cal8">' + out + '</div>';
  }

  function monthBlocks() {
    var start = challengeStart(), g = goalDate();
    var html = '', guard = 0;
    var cur = new Date(start.getFullYear(), start.getMonth(), 1);
    var lastM = new Date(g.getFullYear(), g.getMonth(), 1);
    while (dayNum(cur) <= dayNum(lastM) && guard++ < 24) {
      html += monthBlock(cur);
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
    return html;
  }

  function monthBlock(ym) {
    var y = ym.getFullYear(), m = ym.getMonth();
    var today = midnight(new Date());
    var dim = new Date(y, m + 1, 0).getDate();
    var lead = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一开头
    var DOW = ['一', '二', '三', '四', '五', '六', '日'];
    var cells = '', doneN = 0, i, d;

    for (i = 0; i < 7; i++) cells += '<div class="dw">' + DOW[i] + '</div>';
    for (i = 0; i < lead; i++) cells += '<div class="dcell blank"></div>';

    for (d = 1; d <= dim; d++) {
      var dt = new Date(y, m, d);
      var k = dayKey(dt);
      var n = dayLogs(k).length;
      var cls = 'dcell', inner = String(d), clickable = false;

      if (k === goalKey()) { cls += ' goal'; inner = '🎉'; }
      else if (dayNum(dt) > dayNum(today)) cls += ' fut';
      else if (!inWindow(dt)) cls += ' out';
      else {
        cls += ' ' + dayLevel(n);
        // 没打卡的最近 7 天也能点开 —— 进去补打卡
        clickable = dayGap(today, dt) <= MAKEUP_LIMIT;
      }
      if (k === dayKey(today)) cls += ' today';
      if (n > 0) doneN++;

      cells += '<div class="' + cls + '"' + (clickable ? ' data-act="cal-day" data-k="' + k + '"' : '') +
        ' title="' + k + ' · ' + (n ? n + ' 项打卡' : '没打卡') + '">' + inner + '</div>';
    }

    return '<div class="mon">' +
      '<div class="mon-h"><b>' + y + ' 年 ' + (m + 1) + ' 月</b><span>' + (doneN ? '打卡 ' + doneN + ' 天' : '暂无记录') + '</span></div>' +
      '<div class="mgrid">' + cells + '</div>' +
      '</div>';
  }

  function showDayDetail(k) {
    var arr = dayLogs(k).slice().sort(function (a, b) { return a.ts - b.ts; });
    var d = parseKey(k);
    var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    var html = '<h3>📅 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + w + '</h3>';
    if (!arr.length) {
      html += '<div class="empty">这天没有打卡记录</div>';
    } else {
      var sum = 0;
      html += '<div class="dlist">';
      arr.forEach(function (r) {
        sum += r.got || 0;
        var it = itemById(r.k);
        html += '<div class="row"><span class="em">' + (it ? it.emoji : '✅') + '</span>' +
          '<span class="nm">' + esc(it ? it.name : r.k) + '</span>' +
          (r.m === 1 ? '<span class="mk">补</span>' : '') +
          '<span class="tm">' + fmtTime(r.ts) + '</span>' +
          '<span class="tm" style="color:var(--yellow);font-weight:800">+' + (r.got || 0) + '</span></div>';
      });
      html += '</div>';
      html += '<div style="font-size:11.5px;color:var(--dim);font-weight:700;margin-top:11px">共 ' + arr.length + ' 项 · 获得 ' + sum + ' 积分</div>';
    }
    var gap = dayGap(new Date(), d);
    if (gap >= 0 && gap <= MAKEUP_LIMIT) {
      html += '<button class="btn primary block" data-act="makeup" data-k="' + k + '" style="margin-top:13px">✍️ 补打卡' + (arr.length ? '' : '这天') + '</button>';
    }
    html += '<button class="btn block" data-act="close-modal" style="margin-top:10px">关闭</button>';
    showModal(html);
  }

  /* ---- 补打卡：选日期 → 勾项目 → 按那天的倍率补记 ---- */
  var _mkSel = {};

  function makeupGap(k) { return dayGap(new Date(), parseKey(k)); }

  // 补打记录的时间戳落在补打那一天内（当天的日历时刻 = 现在的时分秒）
  function makeupTs(k) {
    var d = parseKey(k), n = new Date();
    d.setHours(n.getHours(), n.getMinutes(), n.getSeconds(), 0);
    return d.getTime();
  }

  function showMakeup(k) {
    if (makeupGap(k) > MAKEUP_LIMIT) { toast('只能补最近 ' + MAKEUP_LIMIT + ' 天，再早的记不了啦', 'bad'); return; }
    _mkSel = {};
    var d = parseKey(k);
    var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    var day = dayLogs(k);
    var html = '<h3>✍️ 补打卡 · ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + w + '</h3>';
    html += '<div style="font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:10px">勾选那天实际做了的项目，积分按<b style="color:var(--txt)">那天的连击倍率</b>记入，统计会一并更新。</div>';
    html += '<div class="dlist">';
    S.items.forEach(function (it) {
      var n = day.filter(function (r) { return r.k === it.id; }).length;
      var st = itemStreakAt(it.id, k);
      var mult = +(1 + Math.min(st, 10) * 0.1).toFixed(2);
      var got = Math.round(it.points * mult) + (day.length === 0 ? 5 : 0);
      html += '<div class="row" data-act="mk-item" data-id="' + it.id + '" style="cursor:pointer">' +
        '<span class="em">' + it.emoji + '</span>' +
        '<span class="nm">' + esc(it.name) + (n ? ' <span style="font-size:10px;color:var(--dim);font-weight:400">已打 ' + n + ' 次</span>' : '') + '</span>' +
        '<span class="tm" style="color:var(--yellow);font-weight:800">+' + got + '</span></div>';
    });
    html += '</div>';
    html += '<div class="btnrow" style="margin-top:14px">' +
      '<button class="btn" data-act="close-modal">取消</button>' +
      '<button class="btn primary" data-act="mk-go" data-k="' + k + '">确认补打</button></div>';
    showModal(html);
  }

  function mkBtnRefresh() {
    var b = document.querySelector('[data-act="mk-go"]');
    var n = Object.keys(_mkSel).length;
    if (b) b.textContent = n ? ('确认补打（' + n + '）') : '确认补打';
  }

  function makeupGo(k) {
    var ids = Object.keys(_mkSel);
    if (!ids.length) { toast('先勾选要补打的项目', 'bad'); return; }
    if (makeupGap(k) > MAKEUP_LIMIT) { toast('只能补最近 ' + MAKEUP_LIMIT + ' 天', 'bad'); return; }
    var day = S.logs[k] || (S.logs[k] = []);
    var gain = 0, chestGain = 0;
    ids.forEach(function (id) {
      var it = itemById(id);
      if (!it) return;
      var st = itemStreakAt(id, k);
      var mult = +(1 + Math.min(st, 10) * 0.1).toFixed(2);
      var got = Math.round(it.points * mult);
      var isFirst = day.length === 0;
      if (isFirst) got += 5;
      day.push({ k: id, ts: makeupTs(k), got: got, base: it.points, mult: mult, m: 1 });
      gain += got;
    });
    if (day.length >= S.settings.dailyGoal && !S.chests[k]) {
      S.chests[k] = true;
      chestGain = 20 + Math.floor(Math.random() * 81);
      S.bonus.push({ ts: Date.now(), amount: chestGain, reason: '今日目标达成宝箱' });
    }
    closeModal();
    save(); render(); checkAch();
    sfxCheck();
    if (chestGain) {
      confetti(70);
      setTimeout(function () { sfxChest(); }, 180);
      toast('🎁 补打达标！宝箱开出 ' + chestGain + ' 积分', 'good');
    } else {
      toast('已补打 ' + ids.length + ' 项 · +' + gain + ' 积分', 'good');
    }
  }

        '</div>';

    html += '<div class="btnrow" style="margin-top:12px">' +

      '<button class="btn block warn" data-act="reset">清空全部数据</button>' +

        ? '开了同步之后，换设备不用操心；这里留着当「手动档」：导出一段文本存微信或备忘录，是最可靠的一份离线备份，也可以一次带走全部数据。'
        : '数据存在本机浏览器里，换浏览器 / 换手机 / 清缓存都会看不到。想带走：先「导出备份」复制那段文本发到自己的微信或备忘录；在新设备上「导入备份」粘回去，两边记录会自动合并。') +

  function render() {

      document.body.appendChild(bar);

  function tabBtn(id, label) {

  /* ---------------- 弹层 ---------------- */
  function showModal(html) {
    closeModal();
    var mask = document.createElement('div');
    mask.className = 'mask';

  /* ---------------- 导入导出 ---------------- */
  var _pendingBackup = null;   // 待确认导入的备份（已解析、已清洗）
  var _lastPaste = '';         // 上次粘贴/选择的备份原文，返回上一步时回填

  function buildBackupText() { return JSON.stringify(S); }

  // 概览：多少天有记录、总积分、几个项目
  function backupSummary(o) {
    var days = 0, sum = 0, i, j;
    var lg = (o && o.logs) || {};
    Object.keys(lg).forEach(function (k) {
      var arr = lg[k] || [];
      if (arr.length) days++;
      for (i = 0; i < arr.length; i++) sum += (arr[i].got || 0);
    });
    var bn = (o && o.bonus) || [];
    for (j = 0; j < bn.length; j++) sum += (bn[j].amount || 0);
    return { days: days, sum: Math.round(sum), items: ((o && o.items) || []).length };
  }

  // 清洗外来数据：坏字段一律丢掉，避免一份脏备份把页面搞白屏
  function normalizeBackup(o) {
    var items = [];
    (Array.isArray(o.items) ? o.items : []).forEach(function (it) {
      if (!it || typeof it !== 'object' || typeof it.id !== 'string' || !it.id) return;
      if (items.length >= 16) return;
      var pts = (typeof it.points === 'number' && it.points > 0) ? Math.min(99, it.points) : 1;
      items.push({
        id: it.id,
        emoji: (typeof it.emoji === 'string' && it.emoji) ? it.emoji.slice(0, 4) : '⭐',
        name: (typeof it.name === 'string' && it.name) ? it.name.slice(0, 8) : it.id.slice(0, 8),
        points: pts
      });
    });

    var logs = {};
    var src = (o.logs && typeof o.logs === 'object') ? o.logs : {};
    Object.keys(src).forEach(function (day) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Array.isArray(src[day])) return;
      var out = [];
      src[day].forEach(function (r) {
        if (!r || typeof r !== 'object' || typeof r.k !== 'string' || !r.k) return;
        out.push({
          k: r.k,
          ts: typeof r.ts === 'number' ? r.ts : 0,
          got: typeof r.got === 'number' ? r.got : 0,
          base: typeof r.base === 'number' ? r.base : 0,
          mult: typeof r.mult === 'number' ? r.mult : 1
        });
        if (r.m === 1) out[out.length - 1].m = 1;   // 补打卡标记，原样保留
      });
      if (out.length) {
        out.sort(function (a, b) { return a.ts - b.ts; });
        logs[day] = out;
      }
    });

    var bonus = [];
    (Array.isArray(o.bonus) ? o.bonus : []).forEach(function (b) {
      if (!b || typeof b !== 'object') return;
      bonus.push({
        ts: typeof b.ts === 'number' ? b.ts : 0,
        amount: typeof b.amount === 'number' ? b.amount : 0,
        reason: typeof b.reason === 'string' ? b.reason : '奖励'
      });
    });

    var chests = {};
    if (o.chests && typeof o.chests === 'object') {
      Object.keys(o.chests).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && o.chests[k]) chests[k] = true;
      });
    }

    var achs = [];
    (Array.isArray(o.achs) ? o.achs : []).forEach(function (a) {
      if (typeof a === 'string' && achs.indexOf(a) < 0) achs.push(a);
    });

    var flags = {};
    if (o.flags && typeof o.flags === 'object') {
      if (o.flags.addedNoDrink) flags.addedNoDrink = true;
      if (o.flags.addedDedao) flags.addedDedao = true;
      if (Array.isArray(o.flags.qFavs)) flags.qFavs = o.flags.qFavs.slice(0, 60);
    }

    var settings = { dailyGoal: 3, sound: true, quoteAuto: true, goalDate: '2027-01-01' };
    if (o.settings && typeof o.settings === 'object') {
      if (typeof o.settings.dailyGoal === 'number') settings.dailyGoal = Math.max(1, Math.min(8, Math.round(o.settings.dailyGoal)));
      if (typeof o.settings.sound === 'boolean') settings.sound = o.settings.sound;
      if (typeof o.settings.quoteAuto === 'boolean') settings.quoteAuto = o.settings.quoteAuto;
      if (typeof o.settings.goalDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.settings.goalDate)) settings.goalDate = o.settings.goalDate;
    }

    return {
      v: 1,
      name: typeof o.name === 'string' ? o.name.slice(0, 12) : '',
      createdAt: typeof o.createdAt === 'number' ? o.createdAt : Date.now(),
      items: items, logs: logs, bonus: bonus, chests: chests,
      achs: achs, flags: flags, settings: settings
    };
  }

  // 合并：以当前设备为主，把备份里的记录并进来（同一天里时刻相同的那一条只算一次）
  function mergeState(cur, bak) {
    var out = JSON.parse(JSON.stringify(cur));
    if (!out.logs) out.logs = {};
    if (!out.bonus) out.bonus = [];
    if (!out.chests) out.chests = {};
    if (!out.achs) out.achs = [];
    if (!out.flags) out.flags = {};

    // 项目：以当前配置为准，备份里独有的补进来
    var hasId = {};
    out.items.forEach(function (it) { hasId[it.id] = true; });
    bak.items.forEach(function (it) {
      if (!hasId[it.id] && out.items.length < 16) { out.items.push(it); hasId[it.id] = true; }
    });

    // 打卡记录：按天取并集
    Object.keys(bak.logs).forEach(function (day) {
      if (!out.logs[day]) out.logs[day] = [];
      var arr = out.logs[day], seen = {};
      arr.forEach(function (r) { seen[r.k + '@' + r.ts] = true; });
      bak.logs[day].forEach(function (r) {
        var sig = r.k + '@' + r.ts;
        if (!seen[sig]) { arr.push(r); seen[sig] = true; }
      });
      arr.sort(function (a, b) { return a.ts - b.ts; });
    });

    // 宝箱流水：按时刻 + 金额去重
    var bSeen = {}, bAll = out.bonus.concat(bak.bonus);
    out.bonus = [];
    bAll.forEach(function (b) {
      var sig = b.ts + '@' + b.amount;
      if (!bSeen[sig]) { bSeen[sig] = true; out.bonus.push(b); }
    });
    out.bonus.sort(function (a, b) { return a.ts - b.ts; });

    // 宝箱标记与徽章：取并集
    Object.keys(bak.chests).forEach(function (k) { if (bak.chests[k]) out.chests[k] = true; });
    bak.achs.forEach(function (a) { if (out.achs.indexOf(a) < 0) out.achs.push(a); });

    // 迁移标记取或，收藏的箴言取并集
    if (bak.flags.addedNoDrink) out.flags.addedNoDrink = true;
    if (bak.flags.addedDedao) out.flags.addedDedao = true;
    if (bak.flags.qFavs && bak.flags.qFavs.length) {
      var qSeen = {}, qAll = (out.flags.qFavs || []).concat(bak.flags.qFavs);
      out.flags.qFavs = [];
      qAll.forEach(function (q) {
        var sig = typeof q + ':' + String(q);
        if (!qSeen[sig]) { qSeen[sig] = true; out.flags.qFavs.push(q); }
      });
    }

    // 开始时间取更早的那个
    if (bak.createdAt && bak.createdAt < out.createdAt) out.createdAt = bak.createdAt;

    // 本机还没填昵称（比如刚接入的新设备），就沿用云端那个
    if (!out.name && bak.name) out.name = bak.name;

    return out;
  }

  /* ---------------- 云端同步（Vercel 函数 + Turso） ----------------
     同步码 = 钥匙 = 身份：只存在本机，不随数据同步出去，库里存的是它的哈希。
     所有同步都走同一套「拉取 → 合并 → 回推」，撞车（409）就自动重来一轮。
     任何失败只影响这一次有没有同步上去，绝不影响本机打卡。            */
  var SYNC_STORE = 'checkin-island.sync';
  var SYNC_API = '/api/sync';
  var SYNC_TICK_MS = 15 * 60 * 1000;
  var SYNC_ALPHA = 'abcdefghijklmnopqrstuvwxyz234567';   // base32 字母表
  var _syncBusy = false;
  var _syncQuiet = false;        // 同步过程内部产生的写入，不再触发回推
  var _syncSoonTimer = null;
  var _syncTick = null;
  var _syncState = { last: 0, ok: true, msg: '' };

  function syncKey() { try { return localStorage.getItem(SYNC_STORE) || ''; } catch (e) { return ''; } }
  function syncOn() { return !!syncKey(); }
  function syncKeySet(v) {
    try { if (v) localStorage.setItem(SYNC_STORE, v); else localStorage.removeItem(SYNC_STORE); } catch (e) {}
  }
  function syncOkKey(k) { return /^ck_[a-z0-9]{16,64}$/.test(String(k || '')); }
  function syncMask() {
    var k = syncKey();
    return k ? k.slice(0, 9) + '······' + k.slice(-4) : '';
  }
  function syncMakeKey() {
    var buf = new Uint8Array(32), i, s = '';
    if (window.crypto && window.crypto.getRandomValues) { window.crypto.getRandomValues(buf); }
    else { for (i = 0; i < 32; i++) buf[i] = Math.floor(Math.random() * 256); }
    for (i = 0; i < 32; i++) s += SYNC_ALPHA[buf[i] % 32];
    return 'ck_' + s;
  }

  // 一次 API 调用；撞车（409）不抛错，原样交给上层合并
  function syncApi(op, extra) {
    var body = { op: op, key: syncKey() }, kk;
    if (extra) { for (kk in extra) { if (Object.prototype.hasOwnProperty.call(extra, kk)) body[kk] = extra[kk]; } }
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 13000) : null;
    function done() { if (timer) clearTimeout(timer); }
    return fetch(SYNC_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) { j = null; }
        if (!j || typeof j !== 'object') throw { code: 'bad_response', message: '云端返回的内容看不懂' };
        if (j.conflict) {   // 别的设备抢在前面写了：抛出，由同步轮次合并后重推
          throw { code: 'conflict', payload: j.payload || '', ver: j.ver || 0 };
        }
        if (!r.ok || j.ok === false) {
          throw { code: j.error || ('http_' + r.status), message: j.message || ('同步失败（HTTP ' + r.status + '）') };
        }
        return j;
      });
    }).then(function (v) { done(); return v; }, function (e) {
      done();
      if (e && e.code) throw e;
      throw { code: 'network', message: (e && e.name === 'AbortError') ? '网络超时' : '网络连不上云端' };
    });
  }

  // 把云端那一份合并进本机，返回是否真的并进来了东西
  function syncAbsorb(payloadStr) {
    var res = parseBackup(payloadStr);
    if (!res.ok) return false;
    var before = JSON.stringify(S);
    var merged = mergeState(S, res.ok);
    if (JSON.stringify(merged) === before) return false;
    _syncQuiet = true;
    S = merged;
    save();
    _syncQuiet = false;
    syncRepaint();
    return true;
  }

  // 用户正在输入时不要重渲染（会把输入框内容顶掉）
  function syncRepaint() {
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '')) return;
    render();
  }

  async function syncRound() {
    var got = false, round = 0;
    while (round < 3) {
      round++;
      var pulled = await syncApi('pull');
      var ver = 0;
      if (pulled.empty) { ver = 0; }
      else {
        ver = pulled.ver || 0;
        if (pulled.payload) got = syncAbsorb(pulled.payload) || got;
      }
      try {
        await syncApi('push', { baseVer: ver, payload: JSON.stringify(S) });
        return got;
      } catch (e) {
        if (e && e.code === 'conflict' && e.payload) {   // 另一端刚写过：先并进来再推
          got = syncAbsorb(e.payload) || got;
          continue;
        }
        throw e;
      }
    }
    throw { code: 'conflict_loop', message: '两台设备同时改动太频繁，稍后再试' };
  }

  async function syncNow(opts) {
    opts = opts || {};
    if (!syncOn()) { if (!opts.silent) toast('还没连接云端', 'bad'); return { ok: false, code: 'nokey' }; }
    if (_syncBusy) return { ok: false, code: 'busy' };
    _syncBusy = true;
    var wasOk = _syncState.ok;
    try {
      var got = await syncRound();
      _syncState = { last: Date.now(), ok: true, msg: got ? '已合入云端的新记录' : '已是最新' };
      if (!opts.silent) toast(_syncState.msg, 'good');
      return { ok: true, got: got };
    } catch (e) {
      var er = (e && e.code) ? e : { code: 'unknown', message: (e && e.message) || '同步失败' };
      _syncState = { last: Date.now(), ok: false, msg: er.message };
      if (!opts.silent || wasOk) toast('同步没成功：' + er.message + '（本机记录不受影响）', 'bad');
      return { ok: false, code: er.code, message: er.message };
    } finally {
      _syncBusy = false;
      if (tab === 'settings') syncRepaint();
    }
  }

  // 本机数据变了 → 稍后静默回推
  function syncSoon(delay) {
    if (!syncOn()) return;
    if (_syncSoonTimer) clearTimeout(_syncSoonTimer);

      _syncSoonTimer = null;
      syncNow({ silent: true });
    }, delay == null ? 2500 : delay);
  }

  function syncBoot() {
    if (!syncOn()) return;
    setTimeout(function () { syncNow({ silent: true }); }, 1200);
    if (_syncTick) clearInterval(_syncTick);
    _syncTick = setInterval(function () {
      if (document.visibilityState === 'visible') syncNow({ silent: true });
    }, SYNC_TICK_MS);
  }

  function pickBackupFile(cb) {
    var f = document.createElement('input');
    f.type = 'file';
    f.accept = 'application/json,.json,.txt,text/plain';

    document.body.appendChild(f);
    f.onchange = function () {
      var file = f.files && f.files[0];
      if (!file) { f.remove(); return; }
      var r = new FileReader();
      r.onload = function () { cb(String(r.result || '')); f.remove(); };
      r.onerror = function () { toast('文件读不出来', 'bad'); f.remove(); };
      r.readAsText(file);
    };
    f.click();
  }

  // 容错解析：整段直接贴、只贴了正文、前后带说明文字，都能认出来
  function parseBackup(txt) {
    var s = String(txt || '').trim();
    if (!s) return { err: '还没粘贴内容' };
    var i = s.indexOf('{'), j = s.lastIndexOf('}');
    if (i < 0 || j <= i) return { err: '这段文字里没找到备份数据' };
    var obj;
    try { obj = JSON.parse(s.slice(i, j + 1)); }
    catch (e) { return { err: '内容不完整，可能复制时漏了一段' }; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { err: '这不是打卡岛的备份' };
    if (!obj.logs || typeof obj.logs !== 'object') return { err: '这不是打卡岛的备份' };
    var bak = normalizeBackup(obj);
    if (!bak.items.length && !Object.keys(bak.logs).length) return { err: '备份里没有任何打卡记录' };
    return { ok: bak };
  }

  function doDemo() {
    var now = new Date();
    for (var i = 44; i >= 0; i--) {
      var d = addDays(now, -i);
      var k = dayKey(d);
      // 连续段：近 12 天全部有，之前随机
      var doIt = i <= 11 ? true : Math.random() < 0.55;
      if (!doIt) continue;
      var n = 1 + Math.floor(Math.random() * Math.min(5, S.items.length));
      var pool = S.items.slice();
      var arr = [];
      for (var j = 0; j < n; j++) {
        var idx = Math.floor(Math.random() * pool.length);
        var it = pool.splice(idx, 1)[0];
        if (!it) break;
        var hh = 6 + Math.floor(Math.random() * 16);
        var mm = Math.floor(Math.random() * 60);
        var ts = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm).getTime();
        arr.push({ k: it.id, ts: ts, got: it.points, base: it.points, mult: 1 });
      }
      arr.sort(function (a, b) { return a.ts - b.ts; });
      S.logs[k] = arr;
      if (arr.length >= S.settings.dailyGoal && Math.random() < 0.7) {
        S.chests[k] = true;
        S.bonus.push({ ts: arr[arr.length - 1].ts, amount: 20 + Math.floor(Math.random() * 81), reason: '今日目标达成宝箱' });
      }
    }
    save();
    checkAch('silent');
    render();
    toast('演示数据已生成，去统计页看看效果', 'good');
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'tab') { tab = el.getAttribute('data-tab'); prevTab = tab; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); return; }
    if (act === 'settings') {
      if (tab === 'settings') { tab = prevTab || 'today'; }
      else { prevTab = tab; tab = 'settings'; }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
      return;
    }
    if (act === 'check') { checkIn(el.getAttribute('data-id'), el); return; }
    if (act === 'undo') { undo(+el.getAttribute('data-ts')); return; }
    if (act === 'share') { openShare(); return; }
    if (act === 'close-modal') { closeModal(); return; }
    if (act === 'cal-day') { showDayDetail(el.getAttribute('data-k')); return; }
    if (act === 'q-prev') { qMove(-1); return; }
    if (act === 'q-next') { qMove(1); return; }
    if (act === 'q-random') { qRandom(); return; }
    if (act === 'q-fav') { qToggleFav(); return; }
    if (act === 'q-copy') { qCopy(); return; }
    if (act === 'toggle-quote-auto') {
      S.settings.quoteAuto = !qAutoEnabled();
      el.classList.toggle('on', S.settings.quoteAuto);
      save();
      qAutoRestart();
      toast(S.settings.quoteAuto ? '箴言将自动轮播' : '已关闭自动轮播');
      return;
    }
    if (act === 'copy-text') { copyText(); return; }
    if (act === 'toggle-sound') {
      S.settings.sound = !S.settings.sound;
      el.classList.toggle('on', S.settings.sound);
      save();
      if (S.settings.sound) sfxCheck();
      toast(S.settings.sound ? '音效已开启' : '音效已关闭');
      return;
    }
    if (act === 'add-item') {
      if (S.items.length >= 16) { toast('最多 16 个项目', 'bad'); return; }
      S.items.push({ id: uid(), emoji: '⭐', name: '新项目', points: 6 });
      save(); render();
      toast('已添加，修改名字和表情吧');
      return;
    }
    if (act === 'add-emoji') {
      showModal('<h3>🙂 选一个表情</h3><div style="display:flex;flex-wrap:wrap;gap:10px">' +
        EMOJI_POOL.map(function (em) {
          return '<button class="btn" style="font-size:23px;padding:9px 12px" data-act="pick-emoji" data-em="' + em + '">' + em + '</button>';
        }).join('') + '</div>');
      return;
    }
    if (act === 'pick-emoji') {
      var em = el.getAttribute('data-em');
      var inputs = document.querySelectorAll('[data-f="emoji"]');
      var last = inputs.length ? inputs[inputs.length - 1] : null;
      if (last) {
        last.value = em;
        var id = last.getAttribute('data-item');
        var item = itemById(id);
        if (item) { item.emoji = em; save(); }
      }
      closeModal();
      toast('表情已应用到最后一个项目');
      return;
    }
    if (act === 'del-item') {
      var did = el.getAttribute('data-id');
      if (S.items.length <= 1) { toast('至少保留一个项目', 'bad'); return; }
      S.items = S.items.filter(function (x) { return x.id !== did; });
      save(); render();
      toast('项目已删除（历史记录仍保留）');
      return;
    }
    if (act === 'export') { exportData(); return; }
    if (act === 'copy-backup') { copyBackup(); return; }
    if (act === 'download-backup') { downloadBackup(); return; }
    if (act === 'import') { importData(); return; }
    if (act === 'import-file') {
      pickBackupFile(function (txt) {
        _lastPaste = txt;
        var res = parseBackup(txt);
        if (res.err) { toast(res.err, 'bad'); return; }
        importConfirm(res.ok);
      });
      return;
    }
    if (act === 'import-parse') {
      var impEl = document.getElementById('impTxt');
      _lastPaste = impEl ? impEl.value : '';
      var impRes = parseBackup(_lastPaste);
      if (impRes.err) { toast(impRes.err, 'bad'); return; }
      importConfirm(impRes.ok);
      return;
    }
    if (act === 'import-merge') { doImport('merge'); return; }
    if (act === 'import-overwrite') { doImport('overwrite'); return; }
    if (act === 'import-back') { importData(); return; }
    if (act === 'reset') { resetAll(); return; }
    if (act === 'reset-confirm') {
      localStorage.removeItem(KEY);
      load(); render(); closeModal();
      toast('已清空，一切从头开始 💪');
      return;
    }
    if (act === 'makeup') { showMakeup(el.getAttribute('data-k') || ''); return; }
    if (act === 'mk-item') {
      var mkId = el.getAttribute('data-id');
      if (_mkSel[mkId]) { delete _mkSel[mkId]; el.classList.remove('sel'); }
      else { _mkSel[mkId] = 1; el.classList.add('sel'); }
      mkBtnRefresh();
      return;
    }
    if (act === 'mk-go') { makeupGo(el.getAttribute('data-k') || ''); return; }
    if (act === 'demo') { demoData(); return; }
    if (act === 'demo-confirm') {
      closeModal();
      S.logs = {}; S.bonus = []; S.chests = {}; S.achs = [];
      doDemo();
      return;
    }
    if (act === 'sync-create') { syncCreate(); return; }
    if (act === 'sync-join') { syncJoin(); return; }
    if (act === 'sync-join-go') { syncJoinGo(); return; }
    if (act === 'sync-now') { syncNow({ silent: false }); return; }
    if (act === 'sync-show') { syncShowKeyCard(); return; }
    if (act === 'sync-copy') {
      var sk = syncKey();
      if (!sk) { toast('还没有同步码', 'bad'); return; }
      copyPlain(sk, '同步码已复制，去另一台设备粘贴吧');
      return;
    }
    if (act === 'sync-off') { syncOff(); return; }
    if (act === 'sync-off-go') {
      syncKeySet('');
      closeModal(); render();
      toast('已断开同步，本机记录保留');
      return;
    }
    if (act === 'sync-wipe') { syncWipe(); return; }
    if (act === 'sync-wipe-go') {
      closeModal();
      if (!syncOn()) { toast('还没连接云端', 'bad'); return; }
      syncApi('delete').then(function () {
        toast('云端副本已删除', 'good');
      }, function (e) {
        toast('删除失败：' + ((e && e.message) || '未知原因'), 'bad');
      });
      return;
    }
  });

  // 输入类改动（不重渲染，避免失焦）
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var key = t.getAttribute('data-edit');
    if (key === 'name') {
      S.name = t.value.slice(0, 12);
      save();
      return;
    }
    if (key === 'goal') {
      S.settings.dailyGoal = +t.value;
      var lab = t.closest('.card') && t.closest('.card').querySelector('b');
      if (lab) lab.textContent = t.value;
      save();
      return;
    }
    if (key === 'goaldate') {
      var gv = t.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(gv)) {
        S.settings.goalDate = gv;
        save();
        toast('倒计时目标日已更新为 ' + gv);
      }
      return;
    }
    var iid = t.getAttribute('data-item');
    if (iid) {
      var item = itemById(iid);
      if (!item) return;
      var f = t.getAttribute('data-f');
      if (f === 'emoji') item.emoji = t.value.slice(0, 2) || '⭐';
      else if (f === 'name') item.name = t.value.slice(0, 8) || '未命名';
      else if (f === 'points') item.points = Math.max(1, Math.min(99, +t.value || 1));
      save();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ---------------- 启动 ---------------- */
  load();
  render();
  checkAch('silent');
  syncBoot();   // 开了同步就后台拉一次（失败也不打扰）

  // 首次访问提醒
  if (totals().count === 0) {
    setTimeout(function () { toast('点卡片即可打卡，先试试看 👇'); }, 700);
  }
})();
</script>
</body>
</html>
